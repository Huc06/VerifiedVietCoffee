name: CI Backend
on:
  pull_request:
    paths: ['backend/**', 'scripts/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run build
